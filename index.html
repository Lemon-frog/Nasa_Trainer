<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mars Outpost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Mars landscape behind everything. Edit the colors in the paths. -->
    <svg
      class="backdrop"
      viewBox="0 0 800 600"
      preserveAspectRatio="xMidYMax slice"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#241f52" />
          <stop offset=".7" stop-color="#7a3f6e" />
          <stop offset="1" stop-color="#e98f6f" />
        </linearGradient>
      </defs>
      <rect width="800" height="600" fill="url(#bg)" />
      <g fill="#fff">
        <circle cx="90" cy="70" r="2" />
        <circle cx="240" cy="140" r="1.5" />
        <circle cx="420" cy="50" r="2" />
        <circle cx="610" cy="120" r="1.5" />
        <circle cx="730" cy="60" r="2" />
        <circle cx="520" cy="200" r="1.5" />
      </g>
      <circle cx="660" cy="250" r="34" fill="#ffe08a" />
      <path d="M0 470Q200 400 420 460T800 430V600H0z" fill="#b84a3a" />
      <path d="M0 520Q250 470 500 520T800 500V600H0z" fill="#8e3a3a" />
      <path d="M0 565Q300 535 800 565V600H0z" fill="#5c2a3a" />
    </svg>

    <main id="app" aria-live="polite"></main>

    <footer>
      Events come from real, archived NASA records (not live). Sources: NASA
      DONKI space weather, Apollo-era flare records, Mars rover missions.
    </footer>

    <script src="game.js"></script>
  </body>
</html>
